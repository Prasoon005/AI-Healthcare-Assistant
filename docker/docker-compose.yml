version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-healthcare-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_healthcare

    ports:
     - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: